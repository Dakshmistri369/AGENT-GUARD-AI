services:
  - type: web
    name: agentguard-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AGENTGUARD_ALLOW_MOCK_IN_PRODUCTION
        value: "1"
      - key: ENABLE_DEMO_AUTH
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "https://*.vercel.app,http://localhost:5173"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: "nemotron"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"
      - key: AI_MODEL
        value: "nvidia/llama-3.1-nemotron-70b-instruct"
