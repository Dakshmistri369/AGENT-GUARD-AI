version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard_dev   # Change in staging/prod via secrets manager
      POSTGRES_DB: agentguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://agentguard:agentguard_dev@db:5432/agentguard
      AI_PROVIDER: mock
      FRONTEND_ORIGIN: http://localhost:5173
      ENVIRONMENT: development
      DEBUG: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Sandbox image is BUILT here but NOT run as a standing service.
  # It is invoked on-demand by the backend scan runner.
  # NOTE: Sandbox execution is DISABLED in this environment (Docker unavailable locally).
  # sandbox:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.sandbox
  #   # Never run as a standing service — on-demand only

volumes:
  postgres_data:
