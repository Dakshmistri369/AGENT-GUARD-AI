# ==============================================================================
# AgentGuard AI — Narrowly-Scoped Secret Placeholder Allowlist
# ==============================================================================
# This configuration file defines known dummy, tutorial, and documentation
# placeholder values along with supporting context keywords.
#
# AUDIT & SAFETY RULES:
# 1. Matches against this allowlist are NEVER sufficient alone to classify a finding
#    as a placeholder — supporting nearby context is strictly required.
# 2. Values matching real structured token signatures (e.g. AWS AKIA, GitHub ghp_,
#    OpenAI sk-, Private Keys) are PROTECTED and will NEVER be downgraded to
#    likely_placeholder regardless of whether they appear in this file.
# 3. This file is user-auditable and can be extended with organization-specific
#    placeholder conventions.
# ==============================================================================

