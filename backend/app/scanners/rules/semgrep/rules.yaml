rules:
  - id: agentguard.python.sql-injection-format
    languages: [python]
    severity: ERROR
    message: "Detected SQL query constructed via string formatting or f-strings. Use parameterized queries instead."
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021-Injection"
      security-severity: "8.5"
    pattern-either:
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute("..." % (...), ...)
      - pattern: $CURSOR.execute("...".format(...), ...)

  - id: agentguard.python.command-injection-shell-true
    languages: [python]
    severity: ERROR
    message: "subprocess call with shell=True allows command injection if input is untrusted."
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      security-severity: "8.8"
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: agentguard.python.insecure-deserialization-pickle
    languages: [python]
    severity: ERROR
    message: "Avoid using pickle.loads() on untrusted data; it can lead to arbitrary code execution."
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021-Software and Data Integrity Failures"
      security-severity: "9.0"
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: _pickle.loads(...)

  - id: agentguard.python.insecure-yaml-load
    languages: [python]
    severity: WARNING
    message: "yaml.load() without SafeLoader is unsafe and can execute arbitrary code. Use yaml.safe_load()."
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021-Software and Data Integrity Failures"
      security-severity: "7.5"
    pattern: yaml.load($DATA, Loader=yaml.Loader)

  - id: agentguard.python.weak-cryptographic-hash
    languages: [python]
    severity: WARNING
    message: "MD5 and SHA-1 are cryptographically broken. Use SHA-256 or stronger."
    metadata:
      cwe: "CWE-328"
      owasp: "A02:2021-Cryptographic Failures"
      security-severity: "5.5"
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: agentguard.js.insecure-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: "Assigning to innerHTML or outerHTML can lead to Cross-Site Scripting (XSS)."
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021-Injection"
      security-severity: "7.2"
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X

  - id: agentguard.js.child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: "child_process.exec() executes shell commands directly and is vulnerable to command injection."
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      security-severity: "8.5"
    pattern-either:
      - pattern: child_process.exec($CMD, ...)
      - pattern: exec($CMD, ...)

  - id: agentguard.security.hardcoded-jwt-secret
    languages: [python, javascript, typescript]
    severity: ERROR
    message: "Hardcoded secret or private token detected. Load secrets from environment variables instead."
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021-Identification and Authentication Failures"
      security-severity: "8.0"
    pattern-either:
      - pattern: jwt.encode($PAYLOAD, "...", ...)
      - pattern: jwt.decode($TOKEN, "...", ...)
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: jwt.verify($TOKEN, "...", ...)

  - id: agentguard.security.path-traversal-join
    languages: [python]
    severity: WARNING
    message: "Potential path traversal: joining paths with user input without validating Path.resolve()."
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021-Broken Access Control"
      security-severity: "7.0"
    pattern: open(os.path.join($BASE, $INPUT), ...)
